nc: 10  # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n-cls.yaml' will call yolov8-cls.yaml with scale 'n'
  # [depth, width, max_channels]
  512: [1.00, 1.00, 512]   # YOLOv8l summary: 365 layers, 43691520 parameters, 43691504 gradients, 165.7 GFLOPs
  #1024: [1.00, 1.00, 1024]   # YOLOv8l summary: 365 layers, 43691520 parameters, 43691504 gradients, 165.7 GFLOPs

backbone:
  # [from, repeats, module, args]
  - [-1, 1, LCPP, [64, 3, 2, 1]]  # 1-P2/4
  - [-1, 1, LCPP, [256, 3, 2, 1]]  # 1-P2/4
  - [-1, 1, LCPP, [512, 3, 2, 1]]  # 2-P3/8
  - [-1, 1, LCPP, [1024, 3, 2, 1]]  # 3-P4/16
  - [-1, 1, LCPP, [512, 3, 2, 1]]  # 4-P5/32

head:

  #- [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 1, LCVIT, [256, 1024]] # 5

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 3], 1, Concat, [1]]  # cat backbone P4
  - [-1, 3, C2f, [512]]  # 8

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 2], 1, Concat, [1]]  # cat backbone P3
  - [-1, 3, C2f, [256]]  # 11 (P3/8-small)

  - [-1, 1, LCPP, [256, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]  # cat head P4
  - [-1, 3, C2f, [512]]  # 14 (P4/16-medium)

  - [-1, 1, LCPP, [512, 3, 2]]
  - [[-1, 5], 1, Concat, [1]]  # cat head P5
  - [-1, 3, C2f, [1024]]  # 17 (P5/32-large)

  - [[11, 14, 17], 1, RTDETRDecoder, [nc]]  # Detect(P3, P4, P5)
