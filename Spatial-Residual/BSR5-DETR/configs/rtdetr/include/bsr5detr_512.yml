task: detection

model: RTDETR
criterion: SetCriterion
postprocessor: RTDETRPostProcessor


RTDETR: 
  backbone: BackbonewithSpatialResidual
  encoder: BSR5Encoder
  decoder: RTDETRTransformer
  multi_scale: [480, 512, 544, 576, 608, 640, 640, 640, 672, 704, 736, 768, 800]

BackbonewithSpatialResidual:
  max_dim: 512
  num_stages: 5
  freeze_at: -1
  return_idx: [2, 3, 4]
  freeze_norm: False
  pretrained: False 
  act: 'silu'

BSR5Encoder:
  in_channels: [512, 512, 512]
  out_channels: [256, 512, 512]
  hidden_dim: 256
  info_print: True

RTDETRTransformer:
  feat_channels: [256, 512, 512]
  feat_strides: [8, 16, 32]
  hidden_dim: 256
  num_levels: 3

  num_queries: 300

  num_decoder_layers: 6
  num_denoising: 100
  
  eval_idx: -1
  eval_spatial_size: [640, 640]


use_focal_loss: True

RTDETRPostProcessor:
  num_top_queries: 300


SetCriterion:
  weight_dict: {loss_vfl: 1, loss_bbox: 5, loss_giou: 2,}
  losses: ['vfl', 'boxes', ]
  alpha: 0.75
  gamma: 2.0

  matcher:
    type: HungarianMatcher
    weight_dict: {cost_class: 2, cost_bbox: 5, cost_giou: 2}
    # use_focal_loss: True 
    alpha: 0.25
    gamma: 2.0



